<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同济东校区 · 独立资产包</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e5;color:#35453c;font:15px system-ui}header{padding:24px 4%}h1{font-size:25px;margin:0 0 10px}button,select{padding:8px;margin-right:10px;background:#fffdf4;border:1px solid #bac4b0;border-radius:6px}canvas{display:block;width:100%;height:76vh;background:#e7ebd9;image-rendering:pixelated}small{display:block;margin-top:12px;color:#6d786b}</style><header><h1>同济东校区 · 独立资产包</h1><select id="focus"><option value="all">东校区全览</option><option value="street">临街 1、2 号楼</option><option value="c">C 楼</option><option value="tjad">建筑设计研究院</option><option value="design">设计创意学院</option><option value="gate">阜新路门洞</option></select><button id="roads">道路：开</button><small id="status">正在加载建筑 PNG…</small></header><canvas width="1440" height="900"></canvas><script src="data.js"></script><script src="east-campus-assets.js"></script><script>
(async()=>{const api=TongjiEastCampus,images=await api.loadImages(),layer=api.createLayer(images),canvas=document.querySelector('canvas'),c=canvas.getContext('2d');let roads=true;function draw(){let box=api.data.viewBounds;const key=document.querySelector('#focus').value;if(key==='gate'){const g=api.data.gate;box=[g.x-70,g.y-85,g.x+70,g.y+40]}else if(key!=='all'){const b=api.data.buildings.find(b=>b.key===key),r=b.renderRect;box=[r.x-20,r.y-20,r.x+r.width+20,r.y+r.height+20]}const [l,t,r,b]=box,z=Math.min((canvas.width-70)/(r-l),(canvas.height-70)/(b-t));c.setTransform(1,0,0,1,0,0);c.fillStyle='#e7ebd9';c.fillRect(0,0,canvas.width,canvas.height);c.translate((canvas.width-(r-l)*z)/2,(canvas.height-(b-t)*z)/2);c.scale(z,z);c.translate(-l,-t);if(roads)api.drawRoads(c,{includeContext:true});layer.draw(c)}document.querySelector('#focus').onchange=draw;document.querySelector('#roads').onclick=e=>{roads=!roads;e.target.textContent=roads?'道路：开':'道路：关';draw()};draw();document.querySelector('#status').textContent='4 组建筑 · 5 条补充道路 · 阜新路门洞 · 此页面仅依赖本包文件';window.eastAssetPreview={ready:true,api,layer,draw}})().catch(e=>document.querySelector('#status').textContent=e.message);
</script></html>
